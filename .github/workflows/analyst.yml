name: analyst

on:
  workflow_dispatch:
    inputs:
      snapshot_dir:
        description: Folder with brief.md (relative to repo root)
        type: string
        default: snapshots/2026-08-11/rth-rehearsal
      comment_issue:
        description: Also comment the triage on the standing desk issue
        type: boolean
        default: false

jobs:
  analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Claude triage + iPhone push
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          NTFY_URL: ${{ vars.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DESK_GITHUB_ISSUE: ${{ vars.DESK_GITHUB_ISSUE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR="${{ github.event.inputs.snapshot_dir }}"
          if [ ! -f "$DIR/brief.md" ]; then
            echo "no brief at $DIR"
            exit 1
          fi
          python -m xtrading.analyst --snapshot-dir "$DIR" --out /tmp/triage.md
          if [ "${{ github.event.inputs.comment_issue }}" = "true" ] \
             && [ -n "$ANTHROPIC_API_KEY" ] \
             && [ -n "$DESK_GITHUB_ISSUE" ] \
             && [ -s /tmp/triage.md ]; then
            gh issue comment "$DESK_GITHUB_ISSUE" --body-file /tmp/triage.md
          fi

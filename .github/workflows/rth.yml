name: rth

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even outside the 09:30 ET window
        type: boolean
        default: false
  # Backup clock. Dual UTC hours cover EDT (13:30) and EST (14:30).
  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"

concurrency:
  group: finviz-export
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  rth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: RTH open screen
        env:
          FINVIZ_AUTH_TOKEN: ${{ secrets.FINVIZ_AUTH_TOKEN }}
          SNAPSHOT_ROOT: snapshots
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FLAG="--force"; fi
          python -m xtrading.screener rth $FLAG
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "RTH desk snapshot"
          git pull --rebase origin main
          git push
      - name: Comment standing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK_GITHUB_ISSUE: ${{ vars.DESK_GITHUB_ISSUE }}
        run: |
          if [ -z "$DESK_GITHUB_ISSUE" ]; then
            echo "DESK_GITHUB_ISSUE not set; skip inbox comment"
            exit 0
          fi
          DAY=$(ls -1 snapshots | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | tail -1)
          FILE="snapshots/${DAY}/rth/brief.md"
          if [ ! -f "$FILE" ]; then
            echo "no brief at $FILE"
            exit 0
          fi
          gh issue comment "$DESK_GITHUB_ISSUE" --body-file "$FILE"
      - name: Claude triage + iPhone push
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          NTFY_URL: ${{ vars.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DESK_GITHUB_ISSUE: ${{ vars.DESK_GITHUB_ISSUE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY=$(ls -1 snapshots | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | tail -1)
          DIR="snapshots/${DAY}/rth"
          if [ ! -f "$DIR/brief.md" ]; then
            echo "no brief at $DIR; skip triage"
            exit 0
          fi
          if [ -n "$DESK_GITHUB_ISSUE" ]; then
            export DESK_ISSUE_URL="${{ github.server_url }}/${{ github.repository }}/issues/${DESK_GITHUB_ISSUE}"
          fi
          python -m xtrading.analyst --snapshot-dir "$DIR" --out /tmp/triage.md
          # Only the model triage is worth a second issue comment; the no-key
          # headline exists for the push alone.
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$DESK_GITHUB_ISSUE" ] && [ -s /tmp/triage.md ]; then
            gh issue comment "$DESK_GITHUB_ISSUE" --body-file /tmp/triage.md
          fi

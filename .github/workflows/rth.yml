name: rth

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even outside the 09:30 ET window
        type: boolean
        default: false
  # Backup clock. Dual UTC hours cover EDT (13:30) and EST (14:30).
  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"

concurrency:
  group: finviz-export
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  rth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: RTH open screen
        env:
          FINVIZ_AUTH_TOKEN: ${{ secrets.FINVIZ_AUTH_TOKEN }}
          SNAPSHOT_ROOT: snapshots
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FLAG="--force"; fi
          python -m xtrading.screener rth $FLAG
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "RTH desk snapshot"
          git pull --rebase origin main
          git push
      - name: Comment standing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK_GITHUB_ISSUE: ${{ vars.DESK_GITHUB_ISSUE }}
        run: |
          if [ -z "$DESK_GITHUB_ISSUE" ]; then
            echo "DESK_GITHUB_ISSUE not set; skip inbox comment"
            exit 0
          fi
          DAY=$(ls -1 snapshots | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | tail -1)
          FILE="snapshots/${DAY}/rth/brief.md"
          if [ ! -f "$FILE" ]; then
            echo "no brief at $FILE"
            exit 0
          fi
          gh issue comment "$DESK_GITHUB_ISSUE" --body-file "$FILE"
      - name: Fire analyst webhook
        continue-on-error: true
        env:
          ANALYST_WEBHOOK_URL: ${{ secrets.ANALYST_WEBHOOK_URL }}
          ANALYST_WEBHOOK_TOKEN: ${{ secrets.ANALYST_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$ANALYST_WEBHOOK_URL" ]; then
            echo "no analyst webhook configured"
            exit 0
          fi
          DAY=$(ls -1 snapshots | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | tail -1)
          BRIEF=$(cat "snapshots/${DAY}/rth/brief.md")
          jq -n --arg date "$DAY" --arg brief "$BRIEF" \
            '{date:$date, brief:$brief, snapshot_dir:("snapshots/"+$date+"/rth")}' \
            > /tmp/analyst.json
          curl -sS -X POST "$ANALYST_WEBHOOK_URL" \
            -H "Authorization: Bearer $ANALYST_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/analyst.json

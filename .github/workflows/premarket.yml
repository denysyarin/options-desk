name: premarket

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even outside the 09:00–09:29 ET window
        type: boolean
        default: false
  # Backup clock. GitHub cron can run late; the Worker is the on-time one.
  # Dual UTC hours cover EDT (13:00) and EST (14:00). Session gate no-ops the wrong one.
  schedule:
    - cron: "0 13 * * 1-5"
    - cron: "0 14 * * 1-5"

concurrency:
  group: finviz-export
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Premarket prelayer
        env:
          FINVIZ_AUTH_TOKEN: ${{ secrets.FINVIZ_AUTH_TOKEN }}
          SNAPSHOT_ROOT: snapshots
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FLAG="--force"; fi
          python -m xtrading.screener premarket $FLAG
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "Premarket desk snapshot"
          git pull --rebase origin main
          git push
